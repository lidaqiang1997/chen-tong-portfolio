  <script>
    // 字符拆分入场动画（沿用）
    document.addEventListener('DOMContentLoaded', () => {
      const targets = [
        { sel:'.intro-top h1',  baseDelay:0.1 },
        { sel:'.intro-top h2',  baseDelay:0.2 },
        { sel:'.intro-cta p',   baseDelay:2   }
      ];
      targets.forEach(t => {
        const el = document.querySelector(t.sel);
        if(!el) return;
        const text = el.textContent;
        let html = '';
        for(let i=0;i<text.length;i++){
          const ch = text[i];
          const delay = t.baseDelay + Math.random()*0.8 + i*0.02;
          if(t.sel === '.intro-cta p'){
            const vanish = delay + 1 + 3 + Math.random()*0.5;
            html += `<span class="char" style="animation-name:floatUpChar,driftAway;animation-duration:1s,2s;animation-delay:${delay}s,${vanish}s;animation-fill-mode:forwards,forwards;">${ch}</span>`;
          } else {
            html += `<span class="char" style="animation-delay:${delay}s">${ch}</span>`;
          }
        }
        el.innerHTML = html;
      });
    });
  </script>

  <script>
    // 橙子交互：点击 → 掉落动画 → 跳转到对应页面
    const oranges = document.querySelectorAll('.orange-item');
    let isBusy = false;

    oranges.forEach(o => {
      o.addEventListener('click', e => {
        e.preventDefault();
        if (isBusy) return;
        isBusy = true;
        const target = o.dataset.target;
        o.classList.add('falling');
        // 下落动画 ~900ms 完成后跳转
        setTimeout(() => {
          window.location.href = target;
        }, 700);
      });
    });
  </script>
