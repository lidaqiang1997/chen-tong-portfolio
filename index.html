  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.js"></script>
  <script>
    // ========== P5 Tree + 字母悬停掉落 ==========
    let treeImg;
    let particles = [];
    let branchPoints = [];
    // 自拟短句池 —— 鼠标悬停树时字母从树枝掉下
    let letterPool = "做内容的人应当同时是讲故事的人和算法的朋友 让AI替我做重复的那一半 把时间留给有灵魂的那一半 一个人加一个AI等于一支队伍 Content with soul AIGC every day".replace(/\s+/g, "").split("");
    let poemIndex = 0;
    let isFinished = false;
    let groundMap = [];
    let currentSway = 0;
    let mobileShakeTimer = 0;
    let config = { fontSize:15, maxFallSpeed:1.5, drag:0.97, spawnIntensity:12, swayAmplitude:0.03, letterSpacing:20, groundY:0.95, driftRange:0.5, rotateSpeed:0.7, margin:0.2 };

    function preload(){
      treeImg = loadImage('./tree.png',
        () => console.log("tree.png loaded"),
        (e) => console.warn("tree.png not found — using fallback")
      );
    }
    function setup(){
      pixelDensity(1);
      if(!treeImg || !treeImg.width) return;
      let c = createCanvas(treeImg.width, treeImg.height);
      c.parent('p5-overlay');
      let baseLine = height * config.groundY;
      for(let i=0;i<width;i++) groundMap[i] = baseLine;
      treeImg.loadPixels();
      for(let x=0;x<treeImg.width;x+=6){
        for(let y=0;y<treeImg.height;y+=6){
          let idx = (x + y * treeImg.width) * 4;
          if(treeImg.pixels[idx + 3] > 50) branchPoints.push({x,y});
        }
      }
      textFont('Georgia'); textSize(config.fontSize); textAlign(CENTER, CENTER);
    }
    let hasHiddenStaticTree = false;
    function draw(){
      if(!treeImg || !treeImg.width) return;
      clear();
      let canvasElem = document.querySelector('#p5-overlay canvas');
      let eMX = mouseX, eMY = mouseY;
      if(canvasElem){
        eMX = mouseX * (width / canvasElem.offsetWidth);
        eMY = mouseY * (height / canvasElem.offsetHeight);
      }
      let m = width * config.margin;
      let mouseHover = (eMX > m && eMX < width-m && eMY > m && eMY < height-m);
      if(mobileShakeTimer > 0) mobileShakeTimer--;
      let isHovering = mouseHover || (mobileShakeTimer > 0);

      if(!hasHiddenStaticTree && frameCount > 5){
        let t = document.getElementById('treeImg');
        if(t) t.style.opacity = '0';
        hasHiddenStaticTree = true;
      }

      let targetSway = (isHovering && !isFinished) ? sin(frameCount*0.08)*config.swayAmplitude : 0;
      currentSway = lerp(currentSway, targetSway, 0.05);

      push();
      translate(width/2, height);
      shearX(currentSway);
      image(treeImg, -width/2, -height, width, height);
      pop();

      if(isHovering && !isFinished){
        for(let i=0;i<config.spawnIntensity;i++){
          if(poemIndex < letterPool.length){
            let pt = random(branchPoints);
            if(letterPool[poemIndex] !== " ") particles.push(new Letter(pt.x, pt.y, letterPool[poemIndex]));
            poemIndex++;
          } else { isFinished = true; }
        }
      }
      for(let p of particles){ p.update(); p.display(); }

      if(canvasElem){
        let ch = canvasElem.offsetHeight;
        let labels = [
          { sel:'.label.experience',   h:0.71, noiseOff:100 },
          { sel:'.label.portfolio',    h:0.46, noiseOff:200 },
          { sel:'.label.introduction', h:0.25, noiseOff:300 }
        ];
        for(let l of labels){
          let el = document.querySelector(l.sel);
          if(el){
            let swayX = -ch * l.h * Math.tan(currentSway);
            let wn = noise(frameCount*0.01 + l.noiseOff);
            let wind = (wn - 0.5) * 0.2;
            let rot = currentSway * 0.9 + wind;
            el.style.transformOrigin = "top center";
            el.style.transform = `translateX(${swayX}px) rotate(${rot}rad) skewX(${rot*15}deg)`;
          }
        }
      }
    }
    class Letter{
      constructor(x,y,c){
        this.pos=createVector(x,y); this.vel=createVector(random(-0.5,0.5), random(0.1,0.5));
        this.acc=createVector(0,0.04); this.char=c; this.isStatic=false;
        this.angle=random(TWO_PI); this.noiseSeed=random(1000); this.finalAngle=random(-0.4,0.4);
      }
      update(){
        if(this.isStatic) return;
        let breeze = map(noise(this.noiseSeed, frameCount*0.015), 0, 1, -config.driftRange, config.driftRange);
        this.vel.x += breeze * 0.15;
        this.vel.add(this.acc); this.vel.mult(config.drag);
        if(this.vel.y > config.maxFallSpeed) this.vel.y = config.maxFallSpeed;
        this.pos.add(this.vel);
        this.angle += (this.vel.mag()*0.08) * config.rotateSpeed;
        let xIdx = floor(constrain(this.pos.x, 0, width-1));
        if(this.pos.y >= groundMap[xIdx]){
          this.pos.y = groundMap[xIdx]; this.isStatic = true;
          let r = config.letterSpacing/2;
          for(let i=-r;i<=r;i++){
            let cx = floor(constrain(xIdx+i, 0, width-1));
            let lift = map(abs(i), 0, r, config.fontSize*0.65, 0);
            groundMap[cx] -= lift;
          }
        }
      }
      display(){
        push(); translate(this.pos.x, this.pos.y);
        rotate(this.isStatic ? this.finalAngle : this.angle);
        fill(70, this.isStatic ? 200 : 160); noStroke();
        text(this.char, 0, 0); pop();
      }
    }
    function mousePressed(){ handleInput(); }
    function touchStarted(){ handleInput(); }
    function handleInput(){
      let c = document.querySelector('#p5-overlay canvas');
      if(c && mouseX>0 && mouseX<width && mouseY>0 && mouseY<height) mobileShakeTimer = 180;
    }
  </script>

  <script>
    // 字符拆分入场动画
    document.addEventListener('DOMContentLoaded', () => {
      const targets = [
        { sel:'.intro-top h1',  baseDelay:0.1 },
        { sel:'.intro-top h2',  baseDelay:0.2 },
        { sel:'.intro-cta p',   baseDelay:2   }
      ];
      targets.forEach(t => {
        const el = document.querySelector(t.sel);
        if(!el) return;
        const text = el.textContent;
        let html = '';
        for(let i=0;i<text.length;i++){
          const ch = text[i];
          const rnd = Math.random()*0.8;
          const idx = i*0.02;
          const delay = t.baseDelay + rnd + idx;
          if(t.sel === '.intro-cta p'){
            const vanish = delay + 1 + 3 + Math.random()*0.5;
            html += `<span class="char" style="animation-name:floatUpChar,driftAway;animation-duration:1s,2s;animation-delay:${delay}s,${vanish}s;animation-fill-mode:forwards,forwards;">${ch}</span>`;
          } else {
            html += `<span class="char" style="animation-delay:${delay}s">${ch}</span>`;
          }
        }
        el.innerHTML = html;
      });
    });
  </script>
</body>
</html>
