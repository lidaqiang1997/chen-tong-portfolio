  <script>
    // ======= 双行中文提示字符级入场动画 =======
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.tap-line-1, .tap-line-2').forEach(el => {
        const text = el.textContent;
        let html = '';
        for(let i=0;i<text.length;i++){
          const ch = text[i];
          const delay = 0.2 + Math.random()*0.6 + i*0.02;
          html += `<span class="char" style="animation-delay:${delay}s">${ch}</span>`;
        }
        el.innerHTML = html;
      });
    });

    // ======= Element refs =======
    const oranges     = document.querySelectorAll('.ptree-orange');
    const peelBoard   = document.getElementById('peelBoard');
    const peelClose   = document.getElementById('peelClose');
    const fsModal     = document.getElementById('fsModal');
    const fsContent   = document.getElementById('fsContent');
    const fsClose     = document.getElementById('fsClose');
    const imgModal    = document.getElementById('imgModal');
    const imgModalSrc = document.getElementById('imgModalSrc');

    const chuangzuo   = document.querySelector('.ptree-orange.chuangzuo');
    const shipin      = document.querySelector('.ptree-orange.shipin');

    // ======= 设置海报背景图（创作用）=======
    document.querySelectorAll('.bp').forEach(p => {
      if (p.dataset.src) p.style.backgroundImage = `url('${p.dataset.src}')`;
    });
    // ======= 设置视频封面（AI视频 6 个 + step03 2 个，统一处理）=======
    document.querySelectorAll('.bv').forEach(v => {
      const n = v.dataset.n;
      if (n) {
        const player = v.querySelector('.bv-player');
        if (player) player.style.backgroundImage = `url('./images/works/videos/v0${n}-cover.jpg')`;
      }
    });
    document.querySelectorAll('.bv-player[data-cover]').forEach(p => {
      p.style.backgroundImage = `url('${p.dataset.cover}')`;
    });

    // ======= Orange click 分流（创作/视频走拖拽，其它走 click） =======
    oranges.forEach(o => {
      const kind = o.dataset.kind;
      if (kind === 'visual' || kind === 'video') return;   // drag 独立处理
      o.addEventListener('click', e => {
        e.preventDefault();
        if (kind === 'ip' || kind === 'workflow') {
          openFullscreen(kind);
        } else {
          openPeel(kind, o.dataset.peel);
        }
      });
    });

    // ======= 拖拽生长工厂：两颗橙子共用 =======
    const dragInstances = [];     // 用来做互斥：拖一颗时另一颗自动收回

    function initDrag(orange, branchStage, branchSvg, items){
      if (!orange || !branchStage) return;
      let progress = 0, dragging = false, didDrag = false, dragStartX = 0, baseProgress = 0, MAX_DRAG = 700;
      let rafId = null;

      function position(){
        const rect = orange.getBoundingClientRect();
        const ps = document.querySelector('.portfolio-stage').getBoundingClientRect();
        // 起点：Figma 实测的 (52.5%, 13.1%) 偏移位置（橙子挂柄）
        const left  = rect.left + rect.width * 0.525 - ps.left;
        const top   = rect.top  + rect.height * 0.131 - ps.top;
        const width = window.innerWidth - (rect.left + rect.width * 0.525) - 30;
        branchStage.style.left  = left + 'px';
        branchStage.style.top   = top + 'px';
        branchStage.style.width = width + 'px';
        MAX_DRAG = Math.max(280, width - 60);
        render();
      }

      function render(){
        orange.style.transform = `translateX(${progress * MAX_DRAG}px)`;
        branchSvg.style.clipPath = `inset(0 ${(1 - progress) * 100}% 0 0)`;
        items.forEach((it, i) => {
          const threshold = (i + 0.5) / items.length;
          it.classList.toggle('revealed', progress >= threshold);
        });
        // 只要有任一橙子进度 > 0.02 就标记为 pulled（给 CSS 做 tap-hint 隐藏用）
        branchStage.classList.toggle('branch-active', progress > 0.02);
      }

      // 平滑收回：progress 从当前值缓动到 0（ease-out-cubic, 350ms）
      function collapse(){
        if (dragging) return;
        if (progress < 0.01) return;
        if (rafId) cancelAnimationFrame(rafId);
        orange.classList.add('collapsing');
        const startP = progress;
        const t0 = performance.now();
        (function step(t){
          if (dragging) { orange.classList.remove('collapsing'); rafId = null; return; }
          const k = Math.min(1, ((t || performance.now()) - t0) / 350);
          const eased = 1 - Math.pow(1 - k, 3);
          progress = startP * (1 - eased);
          render();
          if (k < 1) rafId = requestAnimationFrame(step);
          else { orange.classList.remove('collapsing'); rafId = null; }
        })(t0);
      }

      orange.addEventListener('pointerdown', e => {
        e.preventDefault();
        // 先取消自己的收回动画（如果有）
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; orange.classList.remove('collapsing'); }
        // 收回其它橙子（互斥：避免重叠）
        dragInstances.forEach(inst => { if (inst.orange !== orange) inst.collapse(); });

        dragging = true;
        didDrag = false;
        dragStartX = e.clientX;
        baseProgress = progress;
        try { orange.setPointerCapture(e.pointerId); } catch(_){}
        orange.classList.add('dragging');
        document.body.classList.add('is-dragging');
      });

      window.addEventListener('pointermove', e => {
        if (!dragging) return;
        const deltaX = e.clientX - dragStartX;
        if (Math.abs(deltaX) > 5) didDrag = true;
        progress = Math.max(0, Math.min(1, baseProgress + deltaX / MAX_DRAG));
        render();
      });

      window.addEventListener('pointerup', () => {
        if (!dragging) return;
        dragging = false;
        orange.classList.remove('dragging');
        document.body.classList.remove('is-dragging');
        // 没有发生拖动（即点击）→ 缓动展开到全部
        if (!didDrag) {
          if (rafId) cancelAnimationFrame(rafId);
          const startP = progress;
          const target = 1;
          const t0 = performance.now();
          (function step(t){
            if (dragging) { rafId = null; return; }
            const k = Math.min(1, ((t || performance.now()) - t0) / 600);
            const eased = 1 - Math.pow(1 - k, 3);
            progress = startP + (target - startP) * eased;
            render();
            if (k < 1) rafId = requestAnimationFrame(step);
            else rafId = null;
          })(t0);
        }
      });

      const instance = { orange, position, render, collapse };
      dragInstances.push(instance);
      return instance;
    }

    // 两颗橙子各自初始化
    const dragC = initDrag(chuangzuo,
      document.getElementById('branchStage'),
      document.getElementById('branchSvg'),
      document.querySelectorAll('.bp'));
    const dragV = initDrag(shipin,
      document.getElementById('branchStageVideo'),
      document.getElementById('branchSvgVideo'),
      document.querySelectorAll('.bv'));

    function positionAll(){ dragC && dragC.position(); dragV && dragV.position(); }
    window.addEventListener('resize', positionAll);
    window.addEventListener('load',  positionAll);
    document.querySelector('.ptree').addEventListener('load', positionAll);
    setTimeout(positionAll, 200);

    // 海报点击放大
    document.querySelectorAll('.bp').forEach(p => {
      p.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        imgModalSrc.src = p.dataset.src;
        imgModal.classList.add('active');
      });
    });

    // 视频点击：弹出视频播放 modal
    const videoModal       = document.getElementById('videoModal');
    const videoModalPlayer = document.getElementById('videoModalPlayer');
    const videoModalClose  = document.getElementById('videoModalClose');

    function openVideo(src){
      if (!src) { alert('视频还没放上去，等我把 v0X.mp4 上传后再点 🍊'); return; }
      videoModalPlayer.src = src;
      videoModal.classList.add('active');
      videoModal.setAttribute('aria-hidden', 'false');
      document.body.classList.add('modal-open');
      setTimeout(() => { videoModalPlayer.play().catch(()=>{}); }, 250);
    }
    function closeVideo(){
      videoModalPlayer.pause();
      videoModalPlayer.currentTime = 0;
      videoModalPlayer.removeAttribute('src');
      videoModalPlayer.load();
      videoModal.classList.remove('active');
      videoModal.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('modal-open');
    }
    videoModalClose.addEventListener('click', closeVideo);
    videoModal.addEventListener('click', e => {
      if (e.target === videoModal) closeVideo();
    });

    document.querySelectorAll('.bv-player').forEach(btn => {
      btn.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        const wrap = btn.closest('.bv');
        const src = btn.dataset.src || (wrap && wrap.dataset.src);
        openVideo(src);
      });
    });

    // ======= 皮 + 海报/视频 横向展示 =======
    function openPeel(kind, peelSrc){
      const count  = kind === 'visual' ? 5 : 6;
      const isVideo = kind === 'video';

      let items = '';
      for(let i = 1; i <= count; i++){
        const playIcon = isVideo ? '<div class="peel-play">▶</div>' : '';
        items += `
          <div class="peel-item ${isVideo ? 'is-video' : ''}" data-n="${i}" style="animation-delay:${0.1 + i*0.1}s">
            <div class="peel-thumb">
              ${playIcon}
              <span class="peel-no">No.${String(i).padStart(2,'0')}</span>
            </div>
            <div class="peel-cap">${isVideo ? '视频' : '海报'} ${i}</div>
          </div>
        `;
      }

      peelBoard.innerHTML = `
        ${peelSrc ? `<img class="peel-long" src="${peelSrc}" alt="" aria-hidden="true" />` : ''}
        <div class="peel-items">${items}</div>
      `;

      peelBoard.classList.add('active');
      peelBoard.setAttribute('aria-hidden', 'false');
      document.body.classList.add('modal-open');

      peelBoard.querySelectorAll('.peel-item').forEach(el => {
        el.addEventListener('click', () => {
          if (isVideo) {
            alert('视频播放（占位）\nNo.' + el.dataset.n);
          } else {
            imgModalSrc.src = makePlaceholderPoster(el.dataset.n);
            imgModal.classList.add('active');
          }
        });
      });
    }

    function closePeel(){
      peelBoard.classList.remove('active');
      peelBoard.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('modal-open');
      setTimeout(() => { peelBoard.innerHTML = ''; }, 500);
    }
    peelClose.addEventListener('click', closePeel);

    // ======= 全屏弹窗 (IP + 工作流) =======
    function openFullscreen(kind){
      // 打开前先收回任何拖出的橙子（创作 / 视频），回到 Portfolio 主页状态
      dragInstances.forEach(inst => inst.collapse());
      fsContent.innerHTML = kind === 'ip' ? renderIP() : renderWorkflow();
      fsModal.classList.add('active');
      fsModal.scrollTop = 0;
      fsModal.setAttribute('aria-hidden', 'false');
      document.body.classList.add('modal-open');

      // 弹窗内动态生成的视频卡：设置封面 + 绑点击播放
      fsContent.querySelectorAll('.bv-player[data-cover]').forEach(p => {
        p.style.backgroundImage = `url('${p.dataset.cover}')`;
      });
      fsContent.querySelectorAll('.bv-player').forEach(btn => {
        btn.addEventListener('click', e => {
          e.preventDefault();
          e.stopPropagation();
          openVideo(btn.dataset.src);
        });
      });
      fsContent.querySelectorAll('.ip-shot').forEach(shot => {
        shot.addEventListener('click', e => {
          e.preventDefault();
          e.stopPropagation();
          imgModalSrc.src = shot.dataset.src;
          imgModal.classList.add('active');
        });
      });
    }
    function closeFullscreen(){
      // 同时关掉嵌套打开的图片放大弹窗 / 视频弹窗，避免回到主页面后还残留
      if (imgModal.classList.contains('active')) closeImgModal();
      if (videoModal.classList.contains('active')) closeVideo();
      fsModal.classList.remove('active');
      fsModal.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('modal-open');
      setTimeout(() => { fsContent.innerHTML = ''; }, 500);
    }
    fsClose.addEventListener('click', closeFullscreen);

    // ======= ESC + 背景点击关闭 =======
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if (videoModal.classList.contains('active')) closeVideo();
      else if (imgModal.classList.contains('active')) closeImgModal();
      else if (fsModal.classList.contains('active')) closeFullscreen();
      else if (peelBoard.classList.contains('active')) closePeel();
    });
    imgModal.addEventListener('click', closeImgModal);
    function closeImgModal(){
      imgModal.classList.remove('active');
      setTimeout(() => { imgModalSrc.src = ''; }, 300);
    }

    // ======= 占位海报 =======
    function makePlaceholderPoster(n){
      const svg = `
        <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 1600' width='900' height='1600'>
          <defs>
            <linearGradient id='g' x1='0' y1='0' x2='0' y2='1'>
              <stop offset='0' stop-color='#fff5ec'/>
              <stop offset='1' stop-color='#ffe6c7'/>
            </linearGradient>
          </defs>
          <rect width='900' height='1600' fill='url(%23g)'/>
          <text x='450' y='300' text-anchor='middle' font-family='Special Elite' font-size='80' fill='%23f29a4a'>POSTER ${n}</text>
          <text x='450' y='400' text-anchor='middle' font-family='Source Code Pro' font-size='24' fill='%23999'>9:16 · 占位长图</text>
        </svg>
      `;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    // ======= IP 时间线内容 =======
    function renderIP(){
      return `
        <h1 class="fs-title">IP 角色设计</h1>
        <p class="fs-subtitle">
          <strong>项目背景：</strong>基于公司现有吉祥物小猫 Data，打造专属 3D 拟人化角色，用于运营 AI 技术科普官方账号。<br/><br/>
          <strong>核心目标：</strong>保留品牌原生识别度的同时，赋予角色科技感与亲和力，适配短视频平台传播特性。
        </p>
        <div class="timeline">
          <div class="timeline-node">
            <div class="timeline-step">STEP 01 · 设计</div>
            <div class="timeline-h">AI 辅助概念生成</div>
            <div class="timeline-body">
              <p><strong>输入：</strong>上传 Data 猫实拍照片 + 手绘手稿（美短花纹、猫耳朵帽子、卷发）</p>
              <p><strong>生成：</strong>通过精准 Prompt 引导 AI 产出 Q 版拟人风格初稿</p>
